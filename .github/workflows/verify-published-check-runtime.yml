name: Verify released Check plugin bytecode and real Paper startup
on:
  push:
    paths:
      - 'Acceptance/verify-published-check.py'
      - 'Acceptance/paper-plugin-runtime.py'
      - '.github/workflows/verify-published-check-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-plugin-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exactly the production-approved Check plugin and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper-ci/plugins
          gh api "repos/${{ github.repository }}/contents/update-manifest.json" --jq .content | base64 -d > paper-ci/manifest.json
          python -m json.tool paper-ci/manifest.json > /dev/null
          version=$(python -c 'import json;print(json.load(open("paper-ci/manifest.json"))["launcher"]["version"])')
          echo "CURRENT_RELEASE=$version"
          gh release download "launcher-v$version" --repo "${{ github.repository }}" --pattern PiricraftCheckServer-1.0.0.jar --dir paper-ci/plugins
          test -s paper-ci/plugins/PiricraftCheckServer-1.0.0.jar
      - name: Assert bytecode allowlist exactly matches all official client MOD hashes
        run: python Acceptance/verify-published-check.py paper-ci/plugins/PiricraftCheckServer-1.0.0.jar paper-ci/manifest.json
      - name: Download Paper 1.21.1 for isolated plugin runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          ua="PiriCraft-ci/1.0 (https://github.com/Pasta0719/Piricraft)"
          curl -fsSL --retry 3 -H "User-Agent: $ua" \
            https://fill.papermc.io/v3/projects/paper/versions/1.21.1/builds/133 > paper-ci/paper-metadata.json
          url=$(jq -er '.downloads["server:default"].url' paper-ci/paper-metadata.json)
          digest=$(jq -er '.downloads["server:default"].checksums.sha256' paper-ci/paper-metadata.json)
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 -H "User-Agent: $ua" \
            -o paper-ci/paper-1.21.1.jar "$url"
          test "$(stat -c %s paper-ci/paper-1.21.1.jar)" -gt 10000000
          echo "$digest  paper-ci/paper-1.21.1.jar" | sha256sum -c -
      - name: Actually boot Paper and enable published server plugin
        run: python Acceptance/paper-plugin-runtime.py paper-ci
      - name: Preserve test Paper log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-paper-check-plugin-boot-log
          path: paper-ci/test-console.txt
          if-no-files-found: ignore
          retention-days: 4
