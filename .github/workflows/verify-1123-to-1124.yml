name: Independently verify live v1.1.23 to v1.1.24 self-upgrade
on:
  push:
    paths:
      - '.github/workflows/verify-1123-to-1124.yml'
permissions:
  contents: read
jobs:
  windows-self-upgrade:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test released old launcher automatically replaces itself with v1.1.24
        shell: pwsh
        run: ./Acceptance/verify-1123-to-1124.ps1
