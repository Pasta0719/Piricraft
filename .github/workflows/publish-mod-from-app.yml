name: Publish MOD change from standalone publisher
run-name: MOD ${{ inputs.filename }} / ${{ inputs.stage_tag }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: update or add
        required: true
        type: choice
        options: [update, add]
      target:
        description: Original mods/filename.jar when updating
        required: false
        type: string
      stage_tag:
        description: Staging release holding incoming JAR
        required: true
        type: string
      filename:
        description: New JAR basename
        required: true
        type: string
      sha256:
        description: Uploaded JAR SHA-256
        required: true
        type: string
      dry_run:
        description: Build and test without publishing
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'PiricraftCheckServer/**'
      - 'PiriCraftModPublisher/ServerBuilder/**'
      - 'PiriCraftModPublisher/Cloud/**'
      - '.github/workflows/publish-mod-from-app.yml'
permissions:
  contents: write
concurrency:
  group: piricraft-publisher-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_STAGE_TAG: ${{ inputs.stage_tag }}
      INPUT_FILENAME: ${{ inputs.filename }}
      INPUT_SHA256: ${{ inputs.sha256 }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and validate; publish only after checks pass
        shell: pwsh
        run: ./PiriCraftModPublisher/Cloud/run-publish.ps1
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-validated-results
          path: |
            work/updated-manifest.json
            dist/PiriCraft.exe
            dist/PiricraftCheckServer-1.0.0.jar
          if-no-files-found: ignore
          retention-days: 7
