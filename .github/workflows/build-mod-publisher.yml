name: Build standalone PiriCraft MOD Publisher
on:
  push:
    paths:
      - 'PiriCraftModPublisher/**'
      - '.github/workflows/build-mod-publisher.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: piricraft-mod-publisher
  cancel-in-progress: false
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate embedded PowerShell engine syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'PublisherApp/publish.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "Publisher engine parse failed"
          }
          Write-Host "POWERSHELL_ENGINE_SYNTAX_OK"
      - name: Build actual standalone EXE
        shell: pwsh
        run: |
          dotnet publish PiriCraftModPublisher/Publisher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:PublishTrimmed=false -o publisher-dist
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Get-ChildItem publisher-dist | Select-Object Name,Length | Format-Table
          $files=Get-ChildItem publisher-dist -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'PiriCraftModPublisher.exe') {
            throw "Not a single-file Windows app: $($files.Name -join ',')"
          }
          $hash=(Get-FileHash publisher-dist/PiriCraftModPublisher.exe -Algorithm SHA256).Hash
          Write-Host "PUBLISHER_EXE_SHA256=$hash"
      - name: Actual Windows window-start smoke test
        shell: pwsh
        run: |
          $since=Get-Date
          $p=Start-Process -FilePath (Resolve-Path 'publisher-dist/PiriCraftModPublisher.exe').Path -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "GUI application closed unexpectedly, exit code $($p.ExitCode)" }
          Write-Host "GUI_PROCESS_ALIVE_AFTER_10_SECONDS"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $bad=Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$since;Id=1026} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'PiriCraftModPublisher' }
          if ($bad) {
            $bad | ForEach-Object {Write-Host $_.Message}
            throw "Application threw a .NET exception"
          }
          Write-Host "GUI_WINDOWS_STARTUP_PASSED"
      - uses: actions/upload-artifact@v4
        with:
          name: PiriCraftModPublisher-Windows-x64
          path: publisher-dist/PiriCraftModPublisher.exe
          compression-level: 0
          if-no-files-found: error
      - name: Publish downloadable EXE on project GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='mod-publisher-v3.0.0'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "PiriCraft MOD Publisher 3.0.0 (standalone)" --notes "Single-file Windows GUI. Select registered MOD or add new JAR, then build and publish using the existing local launcher and PiriCraftCheck sources. Needs GitHub CLI, .NET SDK and Gradle/JDK for production publishing; users authenticate with their own GitHub account. No owner credentials embedded."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag publisher-dist/PiriCraftModPublisher.exe --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'EXE release upload failed' }
