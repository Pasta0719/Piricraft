name: Publish PiriCraft v1.1.22 and enable auto-update
on:
  push:
    paths:
      - '.github/workflows/publish-launcher-1.1.22.yml'
      - 'PiriCraftUpdater/patch_launcher.py'
      - 'PiriCraftUpdater/publish_manifest.py'
      - 'PiriCraftUpdater/mod-parts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: piricraft-v1-1-22-release
  cancel-in-progress: false
jobs:
  publish-and-enable-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the EXACT user-supplied Fabric client MOD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging,dist | Out-Null
          @'
          import hashlib, pathlib
          root=pathlib.Path('PiriCraftUpdater/mod-parts')
          files=sorted(root.glob('piri-juggler.part*.bin'))
          assert len(files)==9, f'Expected 9 original MOD parts, got {len(files)}'
          raw=b''.join(p.read_bytes() for p in files)
          expect='0FA5B2C12E4E8D59D728F5485ECFC6A002CA6B04750D2E8BC775B3F0DFA2B083'
          digest=hashlib.sha256(raw).hexdigest().upper()
          assert digest==expect, f'Client MOD digest mismatch: {digest}'
          pathlib.Path('staging/piri-juggler-fabric-1.0.0.jar').write_bytes(raw)
          print('VERIFIED_CLIENT_JAR',len(raw),digest)
          '@ | python -
      - name: Download exact published v1.1.21 EXE and approved Check server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download launcher-v1.1.21 --repo "${{ github.repository }}" --pattern "PiriCraft.exe" --dir staging
          gh release download check-server-sha-20261011 --repo "${{ github.repository }}" --pattern "PiricraftCheckServer-1.0.0.jar" --dir dist
      - name: Build v1.1.22 while preserving the current launcher auto-updater
        shell: pwsh
        run: |
          python PiriCraftUpdater/patch_launcher.py --input staging/PiriCraft.exe --client-mod staging/piri-juggler-fabric-1.0.0.jar --output dist/PiriCraft.exe
      - name: Assert patched EXE identity and bundle
        shell: pwsh
        run: |
          @'
          import pathlib, hashlib, sys
          sys.path.insert(0, 'PiriCraftUpdater')
          import patch_launcher
          actual=pathlib.Path('dist/PiriCraft.exe').read_bytes()
          assert len(actual)==119774941, 'Unexpected executable size after contiguous CLR resource repair'
          import struct
          digest=hashlib.sha256(actual).hexdigest().upper()
          ix,hdr,entries,_,_=patch_launcher.get_bundle(actual)
          dll=next(x for x in entries if x['path']=='PiriCraft.dll')
          payload=actual[dll['off']:dll['off']+dll['size']]
          assert payload.count(patch_launcher.NEW.encode())==1
          assert payload.count(patch_launcher.OLD.encode())==0
          assert b'1.1.22' in payload
          # Independently verify that the new JAR bytes really exist inside
          # the managed PE resource section rather than checking only its SHA string.
          pe=struct.unpack_from('<I',payload,0x3c)[0]
          nsec=struct.unpack_from('<H',payload,pe+6)[0]
          optsz=struct.unpack_from('<H',payload,pe+20)[0]
          sectab=pe+24+optsz
          blocks=[]
          for k in range(nsec):
              off=sectab+40*k
              name=payload[off:off+8].rstrip(b'\\x00')
              vsize,rva,rsize,raw=struct.unpack_from('<IIII',payload,off+8)
              if name==b'.pirijar': blocks.append((rva,raw,vsize))
          assert len(blocks)==1,'Embedded JAR section missing or duplicated'
          rva,raw,vsize=blocks[0]
          # CLI resource RVA/Size must be contained in ONE contiguous PE section.
          # The previous non-contiguous layout caused BadImageFormatException 0x8007000B.
          cli_rva=struct.unpack_from('<I',payload,pe+24+112+14*8)[0]
          sec_map=[]
          for k in range(nsec):
              off=sectab+40*k
              vs,rv,rs,rf=struct.unpack_from('<IIII',payload,off+8)
              sec_map.append((rv,vs,rs,rf))
          cli_off=next(rf+(cli_rva-rv) for rv,vs,rs,rf in sec_map if rv<=cli_rva<rv+rs)
          resource_rva,resource_size=struct.unpack_from('<II',payload,cli_off+24)
          assert (resource_rva,resource_size)==(rva,vsize),'Invalid CLR resource bounds'
          expected=pathlib.Path('staging/piri-juggler-fabric-1.0.0.jar').read_bytes()
          jarstart=raw+vsize-len(expected)-4
          assert struct.unpack_from('<I',payload,jarstart)[0]==len(expected)
          embedded=payload[jarstart+4:jarstart+4+len(expected)]
          assert embedded==expected,'EXE carries a different Fabric JAR'
          assert hashlib.sha256(embedded).hexdigest().upper()==patch_launcher.NEW
          print('BUNDLE_AND_JAR_SHA_VERIFIED',len(actual),digest,len(embedded))
          '@ | python -
      - name: CRITICAL actual Windows startup smoke test before publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path "dist/PiriCraft.exe").Path
          $since=Get-Date
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "EXE_EXIT_CODE=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "Updated launcher crashed on Windows with exit code $($p.ExitCode)" }
          } else {
            Write-Host "EXE_ALIVE_AFTER_10_SECONDS"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          $crashes=Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$since;Id=1026} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -eq '.NET Runtime' -and $_.Message -match 'PiriCraft' }
          if ($crashes) { $crashes | ForEach-Object {Write-Host $_.Message}; throw "Bad CLR image / runtime crash; DO NOT PUBLISH" }
          Write-Host 'WINDOWS_RUNTIME_SMOKE_PASSED'
      - name: Upload compiled launcher for audit
        uses: actions/upload-artifact@v4
        with:
          name: PiriCraft-v1.1.22-exe
          path: dist/PiriCraft.exe
          if-no-files-found: error
          retention-days: 15
          compression-level: 0
      - name: Publish BOTH updated components to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='launcher-v1.1.22'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "PiriCraft Launcher v1.1.22" --notes "Automatic update from v1.1.21. Includes user-provided updated Fabric MOD (SHA256 0FA5B2C1...) and updated PiriCraftCheck server JAR. Existing launcher update behavior retained."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag dist/PiriCraft.exe dist/PiricraftCheckServer-1.0.0.jar --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ENABLE automatic update AFTER release upload succeeded
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python PiriCraftUpdater/publish_manifest.py dist/PiriCraft.exe
